<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Test 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>#panorama { width: 100vw; height: 100vh; } body { margin: 0; }</style>
</head>
<body>
    <div id="panorama"></div>
    <script>
        pannellum.viewer('panorama', {
            "type": "cubemap",
            "cubeMap": [
            "01_FRONT.jpg",
            "04_LEFT.jpg",
            "03_BACK.jpg",
            "02_RIGHT.jpg",
            "05_TOP.jpg",
            "06_BOTTOM.jpg"
        ],           
            "autoLoad": true
        });
    </script>
</body>

</html>
