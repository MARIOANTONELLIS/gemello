<!DOCTYPE html>
<html>
<head>
    <title></title> 
    <link rel="stylesheet" type="text/css" href="template2.css" />
    <style>
        /* Rimuove margini e blocca le scrollbar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Elimina le barre verticali e orizzontali */
            background-color: #000; /* Fondo nero durante il caricamento */
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Nasconde il titolo ridondante */
        #info {
            display: none !important;
        }

        /* Assicura che il renderer di Three.js non crei spazi extra */
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="divloading"></div>		
    </div>

    <script src="three.min.js"></script>
    <script src="pano0.js"></script>
</body>
</html>
